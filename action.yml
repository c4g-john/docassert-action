name: 'docassert'
description: 'Unit testing for business documents — validate, check cross-document consistency, and build derived status pages.'
author: 'C4G Enterprises Inc.'
branding:
  icon: 'check-square'
  color: 'blue'

inputs:
  command:
    description: >-
      What to run: `validate` (documents against their criteria),
      `consistency` (registry freshness + cross-document checks + RTM),
      `pages` (build the status site into _site/), or
      `projects-check` (registry freshness only).
    default: 'validate'
  paths:
    description: 'Glob(s) for `validate` (ignored by other commands).'
    default: 'documents/**/*.md'
  changed-only:
    description: >-
      For `validate` on a pull request: validate only the documents changed
      vs the PR base (requires actions/checkout with fetch-depth: 0).
      Falls back to `paths` outside a PR.
    default: 'false'
  version:
    description: 'docassert version to install (default: latest release).'
    default: ''
  version-file:
    description: >-
      Path to a file whose first line pins the docassert version (e.g.
      `.docassert-version`). Used when `version` is empty; lets repos keep the
      pin outside workflow files so automation can bump it with GITHUB_TOKEN.
    default: ''
  extras:
    description: 'pip extras to install (e.g. "ai" for advisory checks; empty for none).'
    default: 'ai'
  comment:
    description: >-
      Post the result as a PR comment when running on a pull request
      (needs `permissions: pull-requests: write` in the calling job).
    default: 'true'
  anthropic-api-key:
    description: 'Anthropic API key for AI advisory checks (optional; structural checks gate without it).'
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
      with:
        python-version: '3.12'

    # All ${{ }} values are passed through env and referenced as quoted shell
    # variables, never interpolated into the script body, so no input can be
    # executed as shell.
    - name: Install docassert
      shell: bash
      env:
        EXTRAS: ${{ inputs.extras }}
        VERSION: ${{ inputs.version }}
        VERSION_FILE: ${{ inputs.version-file }}
      run: |
        set -euo pipefail
        if [ -z "$VERSION" ] && [ -n "$VERSION_FILE" ] && [ -f "$VERSION_FILE" ]; then
          VERSION="$(head -n1 "$VERSION_FILE" | tr -d '[:space:]')"
          echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "invalid version in $VERSION_FILE: '$VERSION'" >&2; exit 2; }
        fi
        spec="docassert"
        if [ -n "$EXTRAS" ]; then spec="docassert[$EXTRAS]"; fi
        if [ -n "$VERSION" ]; then spec="${spec}==${VERSION}"; fi
        pip install --quiet "$spec"
        docassert --version

    - name: Run docassert
      shell: bash
      env:
        CMD: ${{ inputs.command }}
        PATHS: ${{ inputs.paths }}
        CHANGED_ONLY: ${{ inputs.changed-only }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        set -euo pipefail
        case "$CMD" in
          validate)
            files="$PATHS"
            if [ "$CHANGED_ONLY" = "true" ] && [ -n "$BASE_SHA" ]; then
              files="$(git diff --name-only "$BASE_SHA" HEAD -- 'documents/**/*.md' | tr '\n' ' ')"
              if [ -z "${files// /}" ]; then
                echo "docassert: no documents changed — nothing to validate."
                exit 0
              fi
            fi
            # $files is intentionally unquoted so the shell expands the glob.
            docassert validate $files --markdown docassert-comment.md --junit docassert-report.xml
            ;;
          consistency)
            docassert projects --check --out projects.yaml
            docassert rtm --out RTM.md
            docassert consistency --markdown docassert-comment.md --junit docassert-report.xml
            ;;
          pages)
            docassert pages --out _site
            ;;
          projects-check)
            docassert projects --check --out projects.yaml
            ;;
          *)
            echo "docassert-action: unknown command '$CMD'" >&2
            exit 2
            ;;
        esac

    - name: Post result to the PR
      if: ${{ always() && inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        if [ -s docassert-comment.md ]; then
          gh pr comment "$PR_NUMBER" --body-file docassert-comment.md \
            || echo "::warning::could not post the PR comment (needs permissions: pull-requests: write)"
        fi
