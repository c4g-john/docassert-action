name: 'Install docassert (self-healing)'
description: >-
  pip-installs docassert at a pinned version, retrying through PyPI index
  propagation so fresh releases never fail a gate. Reads the pin from a
  version file (first line) unless an explicit version is given.
inputs:
  version:
    description: 'Exact version to install (overrides version-file).'
    default: ''
  version-file:
    description: 'File whose first line is the version pin.'
    default: '.docassert-version'
  extras:
    description: 'pip extras, e.g. "ai".'
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Resolve docassert and cache identity
      id: docassert-cache
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        VERSION_FILE: ${{ inputs.version-file }}
        EXTRAS: ${{ inputs.extras }}
        INSTALLER: ${{ github.action_path }}/../scripts/install.py
      run: python "$INSTALLER" prepare

    - name: Restore docassert wheels
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.docassert-cache.outputs.directory }}
        key: ${{ steps.docassert-cache.outputs.key }}

    - name: Install docassert from wheels
      shell: bash
      env:
        DOCASSERT_SPEC: ${{ steps.docassert-cache.outputs.spec }}
        DOCASSERT_WHEELHOUSE: ${{ steps.docassert-cache.outputs.directory }}
        INSTALLER: ${{ github.action_path }}/../scripts/install.py
      run: python "$INSTALLER" install
