name: installer tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  populate-cache:
    name: Populate wheel cache (${{ matrix.extras || 'base' }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extras: ['', 'ai']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: ./install
        with:
          version: '1.0.3'
          extras: ${{ matrix.extras }}
      - run: python -m pip check

  warm-cache:
    name: Offline warm install (${{ matrix.extras || 'base' }})
    needs: populate-cache
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extras: ['', 'ai']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Start with a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/warm"
          echo "$RUNNER_TEMP/warm/bin" >> "$GITHUB_PATH"
      # The prior job's post step must save the complete wheelhouse. No-index
      # ensures this fails if the composite action misses or ignores that cache.
      # Do not disable GitHub networking: actions/cache still needs its service.
      - uses: ./install
        env:
          PIP_NO_INDEX: '1'
          PIP_INDEX_URL: http://127.0.0.1:9
          PIP_EXTRA_INDEX_URL: ''
        with:
          version: '1.0.3'
          extras: ${{ matrix.extras }}
      - run: python -m pip check
